[project]
name = "home-automation"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.2.6",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "requests==2.34.2"
]

[build-system]
requires = ["setuptools >= 81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["webserver"]

[tool.vercel]
entrypoint = "webserver.app:app"
