<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Home Automation</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="site-title"><h1 id="siteTitle">Home Automation</h1></a>
        </div>
        <div class="nav-right" id="navRight">
            <!-- Will be populated by JavaScript -->
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <h2>Login</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p id="loginError" class="error-message"></p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('siteTitle').textContent = SITE_TITLE;
            updateNavbar();
            
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                const result = await login(username, password);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('loginError').textContent = result.message || 'Login failed';
                }
            });
        });
    </script>
</body>
</html>
