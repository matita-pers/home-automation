<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User - Home Automation</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="site-title"><h1 id="siteTitle">Home Automation</h1></a>
        </div>
        <div class="nav-right" id="navRight">
            <!-- Will be populated by JavaScript -->
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <h2>Register New User</h2>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="text" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="text" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p id="registerError" class="error-message"></p>
            <p id="registerSuccess" class="success-message"></p>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('siteTitle').textContent = SITE_TITLE;
            updateNavbar();
            
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (password !== confirmPassword) {
                    document.getElementById('registerError').textContent = 'Passwords do not match';
                    document.getElementById('registerSuccess').textContent = '';
                    return;
                }
                
                const result = await registerUser(username, password);
                if (result.success) {
                    document.getElementById('registerSuccess').textContent = result.message || 'User registered successfully';
                    document.getElementById('registerError').textContent = '';
                    document.getElementById('registerForm').reset();
                } else {
                    document.getElementById('registerError').textContent = result.message || 'Registration failed';
                    document.getElementById('registerSuccess').textContent = '';
                }
            });
        });
    </script>
</body>
</html>
