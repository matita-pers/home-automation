<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Home Automation</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/config.js"></script>
</head>
<body>
    <nav class="navbar"></nav>

    <main class="main-content">
        <div class="auth-container">
            <h2>Change Password</h2>
            <form id="changePasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">New Password:</label>
                    <input type="text" id="newPassword" name="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="text" id="confirmPassword" name="confirmPassword" required>
                </div>
                <button type="submit" class="btn">Change Password</button>
            </form>
            <p id="changePasswordError" class="error-message"></p>
            <p id="changePasswordSuccess" class="success-message"></p>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/change-password.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
