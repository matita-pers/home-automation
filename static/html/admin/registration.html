<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User - Home Automation</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="main-content">
        <div class="auth-container">
            <h2>Register New User</h2>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" class="password-btn">Show</button>
                    <button type="button" id="generatePassword" class="password-btn">Random</button>
                </div>
                <div class="form-group">
                    <label for="isAdmin">
                        <input type="checkbox" id="isAdmin" name="isAdmin">
                        Admin user
                    </label>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <p id="registerError" class="error-message"></p>
            <p id="registerSuccess" class="success-message"></p>
        </div>
    </main>

    <script type="module" src="/admin/js/registration.js"></script>
    <script type="module" src="/js/common.js"></script>
</body>
</html>
