<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Panel - Home Automation</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/config.js"></script>
</head>
<body>
    <nav class="navbar"></nav>

    <main class="main-content">
        <h2>Users Management Panel</h2>
        <div id="usersContainer">
            <div id="usersList"></div>
        </div>
        
        <div class="auth-container" style="margin-top: 2rem;">
            <h3>Edit User</h3>
            <div style="margin-bottom: 1rem;">
                <label for="loadUserId">Load User by ID:</label>
                <input type="number" id="loadUserId" name="loadUserId" style="width: 100px; margin-left: 0.5rem;">
                <button type="button" class="btn" onclick="loadUserById()" style="margin-left: 0.5rem;">Load</button>
            </div>
            <form id="editUserForm" class="auth-form">
                <div class="form-group">
                    <label for="editUserId">User ID:</label>
                    <input type="number" id="editUserId" name="editUserId" required>
                </div>
                <div class="form-group">
                    <label for="editUsername">Username:</label>
                    <input type="text" id="editUsername" name="editUsername" required>
                </div>
                <div class="form-group">
                    <label for="editIsAdmin">
                        <input type="checkbox" id="editIsAdmin" name="editIsAdmin">
                        Admin user
                    </label>
                </div>
                <button type="submit" class="btn">Update User</button>
            </form>
            <p id="editUserError" class="error-message"></p>
            <p id="editUserSuccess" class="success-message"></p>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/users-panel.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
