<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="/js/users/redirect.js" blocking="render"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Panel - Home Automation</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/users/tables.css">
</head>
<body>
    <nav id="navbar"></nav>

    <main class="main-content">
        <h2>Users Management Panel</h2>
        <div id="usersContainer">
            <table id="usersTable">
                <thead>
                    <tr class="table-header">
                        <th>ID</th>
                        <th>Username</th>
                        <th>Admin</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersList">
                    <!-- Users will be dynamically added here -->
                <tr class="table-data"> <td colspan="4" class="no-data">No users found.</td> </tr>
                </tbody>
            </table>
            <button id="reloadUsers" class="btn">Reload users table</button>
        </div>

        <div class="edit-forms">
            <div class="edit-box">
                <h3>Edit User</h3>
                <form id="editUserForm" class="auth-form">
                    <div class="form-group">
                        <label for="editUserId">User ID:</label>
                        <input type="number" id="editUserId" name="editUserId" required readonly />
                    </div>
                    <div class="form-group">
                        <label for="editUsername">Username:</label>
                        <input type="text" id="editUsername" name="editUsername" required />
                    </div>
                    <div class="form-group">
                        <label for="editIsAdmin">
                            <input type="checkbox" id="editIsAdmin" name="editIsAdmin" /> Admin user
                        </label>
                    </div>
                    <button type="submit" class="btn">Update User</button>
                </form>
                <p id="editUserError" class="error-message"></p>
                <p id="editUserSuccess" class="success-message"></p>
            </div>
        </div>
    </main>

    <script type="module" src="/js/admin/users-panel.js"></script>
    <script type="module" src="/js/common.js"></script>
</body>
</html>
