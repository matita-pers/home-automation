name: Auto Promote auto/ & feat/ PRs

on:
  deployment_status:
# when vercel skips the deployment, the above trigger isn't fired
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: write
  pull-requests: write
  deployments: read

jobs:
  find-pr:
    name: Find Associated PR
    runs-on: ubuntu-latest
    if: >- 
      ${{
        (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
        || (github.event_name == 'issue_comment' && github.event.comment.user.id == 35613825 
            && github.event.issue.pull_request && contains(github.event.comment.body, 'Skipped Deployment'))
      }}
    outputs:
      pr_found: ${{ steps.find-pr.outputs.found }}
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      head_sha: ${{ steps.find-pr.outputs.head_sha }}
      deployed: ${{ steps.find-pr-deployement.outputs.deployement }}
    steps:
      - name: Find PR from deployment
        id: find-pr-deployement
        if: github.event_name == 'deployment_status'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "deployement=true" >> $GITHUB_OUTPUT
          sha="${{ github.event.deployment.sha }}"
          echo "Finding PR for deployment SHA: $sha, environment: ${{ github.event.deployment.environment }}"

          # Find open PRs with this HEAD SHA
          prs=$(gh api repos/${{ github.repository }}/pulls --jq ".[] | select(.head.sha == \"$sha\") | .number")

          if [ -z "$prs" ]; then
            echo "::error::No open PR found with deployment SHA $sha"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the first matching PR
          number=$(echo "$prs" | head -n 1)

          echo "found=true" >> $GITHUB_OUTPUT
          echo "pr_number=$number" >> $GITHUB_OUTPUT
          echo "Found PR #$number for deployment"

      - name: Find PR from comment
        id: find-pr-comment
        if: github.event_name == 'issue_comment'
        run: |
          echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Get data from correct step
        id: find-pr
        run: |
          if [ -n "$deployment" ]; then
            echo "found=$found" >> $GITHUB_OUTPUT
            echo "pr_number=$numberd" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "pr_number=$numberc" >> $GITHUB_OUTPUT
          fi
        env:
          deployment: ${{ steps.find-pr-deployement.outputs.deployement }}
          numberd: ${{ steps.find-pr-deployement.outputs.pr_number }}
          found: ${{ steps.find-pr-deployement.outputs.found }}
          numberc: ${{ steps.find-pr-comment.outputs.pr_number }}

  check-pr:
    runs-on: ubuntu-latest
    needs:
      - find-pr
    if: ${{ needs.find-pr.outputs.pr_found == 'true' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.find-pr.outputs.pr_number }}
    outputs:
      ref: ${{ steps.check-head.outputs.ref }}
    steps:
      - name: Login to GitHub App
        uses: actions/create-github-app-token@v3
        id: login
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}

      - id: check-draft
        name: Check if PR is draft
        run: |
          draft=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.draft')
          case "$draft" in
            false) ;;
            *)
              echo "::error::the pr is in draft state"
              exit 1
              ;;
          esac

      - id: check-author
        name: Check if PR author is authorized
        run: |
          author=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.user.id')
          echo "PR author: $author"
          case "$author" in
            155455608) ;;
            *)
              echo "::error::PR author $author is not authorized for auto-merge"
              exit 1
              ;;
          esac

      - id: check-base
        name: Check if base branch is eligible for auto-merge
        run: |
          base=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.base.ref')
          echo "base branch: $base"
          case "$base" in
            main) ;;
            *)
              echo "::error::base branch is not enabled for auto-merge: $base"
              exit 1
              ;;
          esac

      - id: check-head
        name: Check if head branch is eligible for auto-merge
        run: |
          head=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.head.ref')
          echo "head branch: $head"
          echo "ref=$head" >> $GITHUB_OUTPUT
          case "$head" in
            auto/*) ;; # created by push hook on main
            feat/*) ;;
            *)
              echo "::error::head branch is not enabled for auto-merge: $head"
              exit 1
              ;;
          esac

      - id: check-site
        name: Check if site is working fine
        # if only non-site-related files are modified, this is useless
        if: ${{ needs.find-pr.outputs.deployed == 'true' }}
        run: |
          local code=0
          
          check-url() {
            curl -sSLf -o /dev/null \
              -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
              $BURL$@
            local ccode=$?
            if [ $ccode -ne 0 ]; then
              code=$ccode
            fi
          }
          
          check-url "/"
          # in the future static files will be managed by the CDN, so this is checking the vercel function directly
          check-url "/api/health"
          
          exit $code
        env:
          BURL: ${{ github.event.deployment_status.target_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}

  rebase:
    runs-on: ubuntu-latest
    needs:
      - check-pr
      - find-pr
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.find-pr.outputs.pr_number }}
    steps:
      - name: Login to GitHub App
        uses: actions/create-github-app-token@v3
        id: login
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
      
      - name: Setup git credentials
        id: setup-git
        run: |
          appid=$(gh api "/users/$appname" --jq .id)
          git config --global user.name $appname
          git config --global user.email '$appid+$appname@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.login.outputs.token }}
          appname: ${{ steps.login.outputs.app-slug }}[bot]

      - uses: actions/checkout@v7
        with:
          fetch-depth: '9' # 8 commits to rebase + 1 commit already present in main
          persist-credentials: true
          ref: ${{ needs.check-pr.outputs.ref }}
          token: ${{ steps.login.outputs.token }}

      - id: rebase
        name: Rebase PR
        run: |
          git push origin HEAD:main
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::push failed, ensure the branch is up to date"
          fi
          exit $code
        # I am doing my own error checking
        shell: /usr/bin/bash {0}
